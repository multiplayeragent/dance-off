<script type="module">
/* ═══ DANCE OFF · a Multiplayer Agent starter ═════════════════════════════════════════
 * Arrows slide in on the beat: hit the matching arrow and your 3D dancer busts a move.
 * Keep a streak going to unlock bigger moves. Then everyone votes for the best dancer
 * (not themselves). Party, 2–8 players; bots fill empty spots on the stage.
 *
 * WHERE THINGS ARE (search for the "── " headers):
 *   CONFIG ........ timing windows, scoring, the streaks that unlock each tier of moves, bots
 *   CONNECTION .... MP_CONNECT, joining, the offline room, who is host
 *   SONG .......... the seeded song: tempo, chords, the beat and the arrows. Same seed = same
 *                   song and the same arrows for everyone.
 *   MUSIC ......... WebAudio: drums, bass and pads queued just ahead of the beat
 *   STAGE ......... the club: light-up floor, back wall, beams, disco ball, confetti
 *   DANCERS ....... the dancer model and its moves (one per arrow, bigger with each tier)
 *   ROUND (HOST) .. the phases (count, dance, vote, done), the bots' dancing and votes, the
 *                   vote count. Only the host writes these.
 *   MY DANCE ...... judging your arrows, streak, score; your vote
 *   HUD ........... the arrow track, rankings, vote card, results card, leaderboard
 *   INPUT ......... arrow keys or WASD; on phones, the four arrow buttons
 *

 *     so every player's song starts together; the song and its arrows come from mulberry32(seed).
 *   - The HOST is the lowest sessionId among live players (heartbeat seen in the last 3s),
 *     worked out every frame. It counts in, ends the song, runs the vote and counts it. It
 *     also plays the bots: their scores, moves and votes go in `bots` a few times a second.
 *     A new host adopts both and carries on from the timestamps.
 *   - Each player judges its OWN arrows and writes `d` {r, sc, st, mx, p, g, m, mv, mk}
 *     (round, score, streak, best streak, perfect/good/miss counts, last move and a move
 *     counter: a new mk makes your dancer do move mv on every screen), `vote` {r, f} (who it
 *     votes for), `hb` (heartbeat) once a second, `rdy` (Play again) and `n`/`c` (name, color).
 *     No intents: nobody's dance changes anyone else's score.
 *   - Someone who arrives mid-song dances from where the song is.

/** Line up for a round: arrows already gone by are skipped (not missed) if you came in late. */
function joinRound(r) {

  while (me.next < song.arrows.length && song.arrows[me.next].t < t + CONFIG.good) me.next++;
  if (ATTRACT) Object.assign(me.st, { st: 28, mx: 28 }); // the preview starts mid-streak
  $("over").hidden = true; trackFx.length = 0; publish(true);
}
/** An arrow pressed at time `at`: judge the closest arrow within reach. The wrong arrow is a miss. */
function press(d, at) {

  const r = round();

function judge(i, j) {

  me.st.mv = j === "M" ? -1 : a.d; me.st.mk++;
  const v = views.get(net.sessionId), tier = tierOf(me.st.st);

  if (j !== "M") hitSound(song, a, j); else if (hadStreak >= 8) blip(220, 90, 0.25, 0.15);
  trackFx.push({ kind: "judge", j, at: performance.now(), d: a.d });
  if (tier > before) { toast(`${TIER_NAMES[tier].toUpperCase()} MOVES!`); blip(660, 1320, 0.3, 0.12); if (v) burst(v.x, v.y + 2, v.z, 30); }
  publish(j === "M");

/** Every frame: arrows that slid past the ring unpressed are misses. */
function sweepMisses(r) {

}
function publish(force) {

  if (json === me.lastJson || (!force && now - me.lastSend < CONFIG.sendMs)) return;
  me.lastSend = now; me.lastJson = json; net.me.set("d", json);
}
function castVote(id) {
  const r = round();

  me.vote = id; net.me.set("vote", JSON.stringify({ r: r.id, f: id })); blip(520, 880, 0.15, 0.1); drawVote(r, true);

/** ?attract: your arrows press themselves, mostly on the beat. */

}

// ── HUD ─────────────────────────────────────────────────────────────────────────────
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
const touchUI = matchMedia("(pointer: coarse)").matches;
const track = $("track"), tctx = track.getContext("2d"), trackFx = [];
let TW = 0, TH = 0;
function fitTrack() { const d = Math.min(2, devicePixelRatio || 1), b = track.getBoundingClientRect(); TW = b.width; TH = b.height; track.width = Math.round(TW * d); track.height = Math.round(TH * d); tctx.setTransform(d, 0, 0, d, 0, 0); }
addEventListener("resize", fitTrack);
function arrowShape(x, y, s, d, fill, alpha = 1) {

  tctx.beginPath(); tctx.moveTo(s, 0); tctx.lineTo(0, -s); tctx.lineTo(0, -s * 0.45); tctx.lineTo(-s, -s * 0.45); tctx.lineTo(-s, s * 0.45); tctx.lineTo(0, s * 0.45); tctx.lineTo(0, s); tctx.closePath();

/** The arrow track: arrows slide from the right into the ring on the left, right on the beat. */
function drawTrack(r, now) {

    if (f.j !== "M") { tctx.strokeStyle = ARROW_COLORS[f.d]; tctx.globalAlpha = 1 - age * 2; tctx.lineWidth = 5; tctx.beginPath(); tctx.arc(ringX, cy, 26 + age * 60, 0, Math.PI * 2); tctx.stroke(); tctx.globalAlpha = 1; }

    tctx.textAlign = "right"; tctx.textBaseline = "top"; tctx.font = "900 15px ui-monospace, Menlo, Consolas, monospace"; tctx.fillStyle = "#f6f2ff"; tctx.fillText(st.sc.toLocaleString("en-US"), TW - 12, 8);
    tctx.textBaseline = "bottom"; tctx.font = "800 12px system-ui, sans-serif"; tctx.fillStyle = st.st >= CONFIG.tiers[1] ? "#ffd23f" : "#b0a8d6";

let toastTimer = 0;
function toast(text) { $("toast").textContent = text; $("toast").style.opacity = 1; clearTimeout(toastTimer); toastTimer = setTimeout(() => ($("toast").style.opacity = 0), 1400); }
function litKey(d) { const b = $("keys").children[d]; if (b) { b.classList.add("lit"); setTimeout(() => b.classList.remove("lit"), 120); } }
let board = null, boardFor = -1, voteDrawn = "";
function hud(r, list) {
  const t = Date.now(), song = songOf(r.seed);
  $("song").textContent = ATTRACT ? "" : `♪ ${song.name} · ${song.bpm} BPM`;
  const ranked = [...list].sort((a, b) => b.sc - a.sc);
  $("ranks").hidden = r.phase === "done";
  $("ranks").innerHTML = ranked.map((x) => `<div class="${x.mine ? "me" : ""}"><i style="background:${esc(x.color)}"></i><b>${esc(x.mine ? "You" : x.name)}</b><span>${x.st >= CONFIG.tiers[1] ? "🔥" : ""}${x.sc}</span></div>`).join("");
  const left = r.startAt - t;
  $("big").textContent = r.phase === "count" && left < 3000 ? String(Math.max(1, Math.ceil(left / 1000))) : r.phase === "dance" && t - r.startAt < 700 && !ATTRACT ? "DANCE!" : "";
  if (ATTRACT) { $("net").textContent = ""; $("hint").textContent = ""; $("over").hidden = true; $("vote").hidden = true; return; }
  const n = livePlayers().length;
  $("net").textContent = netDown ? "Reconnecting…" : net.offline ? "Offline: playing with bots" : `Online · ${n} player${n === 1 ? "" : "s"}${isHost() ? " · you run the show" : ""}`;
  const how = touchUI ? "Tap the arrow buttons" : "Press ← ↓ ↑ → (or WASD)";
  $("hint").textContent = r.phase === "count" ? `${how} as each arrow hits the ring.${audio ? "" : touchUI ? " Tap for sound." : " Press a key for sound."}`
    : r.phase === "dance" && t - r.startAt < 6000 ? (me.late ? "You joined mid-song: dance from here!" : `${how} on the beat! Streaks unlock bigger moves.`) : r.phase === "dance" && !audio ? (touchUI ? "Tap an arrow to turn the music on" : "Press a key to turn the music on") : "";

  $("pad").hidden = r.phase === "vote" || r.phase === "done";

  if (r.phase === "vote") drawVote(r, false);

}
function drawVote(r, force) {

  $("voteSub").textContent = `${me.vote ? "Vote cast! You can still change it." : "Tap a dancer (not yourself)."} ${voted}/${list.length} voted · ${Math.max(0, Math.ceil((r.endsAt - Date.now()) / 1000))}s`;
  const key = r.id + ":" + me.vote + ":" + others.map((x) => x.id + x.sc).join();

  voteDrawn = key;
  $("choices").innerHTML = others.map((x) => `<button data-id="${esc(x.id)}" class="${me.vote === x.id ? "on" : ""}"><i style="background:${esc(x.color)}"></i><span>${esc(x.name)}<small>${x.sc.toLocaleString("en-US")} pts · best streak ${x.mx}</small></span></button>`).join("");
  for (const b of $("choices").children) b.onclick = () => castVote(b.dataset.id);
}
function showResults(r) {
  const res = r.res || [], top = res[0];
  $("winner").textContent = !top ? "Song over" : top[0] === net.sessionId ? "You're the best dancer!" : `${top[1]} is the best dancer!`;
  const tie = top && res[1] && res[1][3] === top[3];
  $("winSub").textContent = !top ? "" : `${top[3]} vote${top[3] === 1 ? "" : "s"}${tie ? " (won the tie on points)" : ""}`;
  $("results").innerHTML = res.map(([id, name, color, votes, sc, mx]) => `<li class="${id === net.sessionId ? "me" : ""}"><b style="color:${esc(color)}">●</b> ${esc(id === net.sessionId ? "You" : name)}<span>${votes} ★</span><small>${Number(sc).toLocaleString("en-US")} pts · best streak ${mx}</small></li>`).join("");
  const list = $("board");
  if (!board) { list.innerHTML = "<li>Leaderboards need a connection.</li>"; return; }
  list.innerHTML = "<li>Loading…</li>";
  const mine = me.roundId === r.id && me.submitted !== r.id ? me.st.sc : 0;
  me.submitted = r.id;
  (mine ? board.submit(mine).catch(() => null) : Promise.resolve()).then(() => board.top(10)).then(({ entries }) => {
    list.innerHTML = entries.length ? entries.map((e) => `<li>${esc(e.username || "Player")}<span>${Number(e.score).toLocaleString("en-US")}</span></li>`).join("") : "<li>No scores yet. Set the first.</li>";
  }).catch(() => { list.innerHTML = "<li>Couldn't load the leaderboard.</li>"; });
}
function playAgain() { const r = round(); if (r && r.phase === "done") { me.ready = r.id; net.me.set("rdy", r.id); $("again").textContent = "Waiting for the others…"; } }
$("again").onclick = playAgain;

// ── INPUT ───────────────────────────────────────────────────────────────────────────
addEventListener("keydown", (e) => {
  if (e.repeat || e.ctrlKey || e.metaKey || e.altKey) return;
  const d = KEYS[e.key.toLowerCase()];
  if (d !== undefined) { e.preventDefault(); press(d, e.timeStamp); }
  else if (e.key === " " || e.key === "Enter") { unlockAudio(); if (round()?.phase === "done") { e.preventDefault(); playAgain(); } }
});
for (const b of $("keys").children) b.addEventListener("pointerdown", (e) => { e.preventDefault(); press(+b.dataset.d, e.timeStamp); });
document.addEventListener("pointerdown", () => unlockAudio());
document.addEventListener("touchmove", (e) => { if (e.target === renderer.domElement || e.target.closest("#pad")) e.preventDefault(); }, { passive: false });
if (touchUI) $("keys").hidden = false;

// ── MAIN LOOP ───────────────────────────────────────────────────────────────────────
let last = performance.now(), lastHb = 0, lastHud = 0, lastBeat = -1, lastPhase = "", winnerShown = -1;
const camPos = new THREE.Vector3(0, 4, 14), camLook = new THREE.Vector3(0, 1.4, 0);
function frame(now) {
  const dt = Math.max(0, Math.min(0.05, (now - last) / 1000)); last = now; // the first frame can be stamped before `last`
  if (now - lastHb > 1000) { lastHb = now; net.me.set("hb", Date.now()); fixColor(); }
  if (isHost()) hostTick(now); else host.wasHost = false;
  const r = round();
  if (r) {
    if (r.phase !== "done" && r.phase !== "vote" && me.roundId !== r.id) joinRound(r); // a new song, or you just arrived: line up
    if (r.phase === "dance" && me.roundId === r.id) { autopilot(r); sweepMisses(r); publish(false); }
    if (lastPhase !== r.phase) { if (r.phase === "done") blip(523, 1046, 0.6, 0.15); lastPhase = r.phase; }
    scheduleMusic(r);
    const list = dancers(r);

    drawTrack(r, now);
    if (now - lastHud > 100) { lastHud = now; hud(r, list); }

  requestAnimationFrame(frame);
}
/** Place, animate and light every dancer, then the club around them, then the camera. */
function drawStage(r, list, now, dt) {
  const song = songOf(r.seed), t = Date.now() - r.startAt, grooving = r.phase === "dance" || r.phase === "vote" || (r.phase === "count" && t > -song.beat * 4);
  const beatNo = Math.floor(t / song.beat), beatPhase = grooving ? ((t % song.beat) + song.beat) % song.beat / song.beat : 0, pulse = grooving ? Math.pow(1 - beatPhase, 3) : 0;
  const portrait = camera.aspect < 0.85, slots = slotsFor(list.length, portrait);

  const showcase = r.phase === "vote" || r.phase === "done", seen = new Set();

  if (beatNo !== lastBeat) { lastBeat = beatNo; if (r.phase === "count" && beatNo < 0 && beatNo >= -3) blip(880, 880, 0.08, 0.12); }
  order.forEach((x, k) => {
    const v = viewOf(x.id), s = slots[k]; seen.add(x.id);
    setColor(v, x.color);
    if (v.fresh) { v.x = s.x; v.y = s.y; v.z = s.z; v.fresh = false; v.mk = x.mk; }
    const ease = 1 - Math.pow(0.02, dt); v.x += (s.x - v.x) * ease; v.y += (s.y - v.y) * ease; v.z += (s.z - v.z) * ease;
    v.g.position.set(v.x, v.y, v.z); v.g.rotation.y = Math.atan2(-v.x * 0.15, 1);
    if (!x.mine && x.mk !== v.mk) { v.mk = x.mk; if (r.phase === "dance") startMove(v, x.mv, tierOf(x.st), now); } // someone else's new move
    if (showcase && grooving && (!v.move || now - v.move.at > song.beat * 1.6) && beatPhase < 0.2) startMove(v, (beatNo + k) % 4, tierOf(x.mx), now); // the vote: everyone shows off their best tier
    poseDancer(v, now, song.beat, beatPhase);
    const flash = Math.max(0, 1 - (now - v.flash) / 300), fever = (r.phase === "dance" ? tierOf(x.st) : showcase ? tierOf(x.mx) : 0) >= 3;
    v.disc.material.opacity = 0.18 + flash * 0.5 + (fever ? 0.2 : 0);
    v.ring.visible = fever; if (fever) { v.ring.scale.setScalar(1 + pulse * 0.25); v.ring.rotation.z += dt * 2; }
    v.crown.visible = r.phase === "done" && r.win === x.id;
    if (fever && Math.random() < dt * 3) burst(v.x, v.y + 1.2, v.z, 2, 3);
    placeTag(v, x.mine ? "You" : x.name + (r.phase === "dance" && x.st >= CONFIG.tiers[1] ? ` 🔥${x.st}` : ""), x.mine, !ATTRACT);
  });
  for (const id of [...views.keys()]) if (!seen.has(id)) dropView(id);

  glowA.color.set(ARROW_COLORS[mod(beatNo, 4)]); glowB.color.set(ARROW_COLORS[mod(beatNo + 2, 4)]);

  const halfW = Math.max(...slots.map((s) => Math.abs(s.x)), 1) + 1.4, hfov = 2 * Math.atan(Math.tan((camera.fov * Math.PI) / 360) * camera.aspect);
  let dist = Math.max(7.5, halfW / Math.tan(hfov / 2)), look = new THREE.Vector3(0, portrait ? 0.9 : 1.1, -0.5);
  if (ATTRACT) dist *= 0.95;
  const winner = r.phase === "done" && views.get(r.win);
  if (winner) {
    dist = camera.aspect < 1 ? 11 : 7; look = new THREE.Vector3(winner.x, winner.y + 1.3, winner.z);
    const tanV = Math.tan((camera.fov * Math.PI) / 360);
    if (innerWidth >= 760) look.x += dist * tanV * camera.aspect * 0.42; // card on the right: winner on the left
    else look.y -= dist * tanV * 0.42; // card at the bottom: winner up top
  }
  const sway = Math.sin(tt * 0.35) * (winner ? 1.5 : 1.2);
  camPos.lerp(V3.set(look.x + sway, look.y + 2.3 + dist * 0.12 + pulse * 0.05, look.z + dist), 1 - Math.pow(0.05, dt)); camLook.lerp(look, 1 - Math.pow(0.05, dt));

  renderer.render(scene, camera);
}
/** Two players picked the same color at once (the joiner's first state can be empty): the later sessionId picks again. */
function fixColor() {

  if (!others.some(([id, p]) => p.c === myColor && id < net.sessionId) && !bots.includes(myColor)) return; // a bot in your color: you change
  const taken = new Set([...others.map(([, p]) => p.c), ...bots]), free = COLORS.find((c) => !taken.has(c));
  if (free) { myColor = free; net.me.set("c", free); }
}

(async function start() {
  net = await connect();
  net.onState((st) => { S = st; });
  net.onDisconnect(() => { netDown = true; $("net").textContent = "Reconnecting…"; });
  net.onReconnect(() => { netDown = false; });
  if (!net.offline && typeof MP !== "undefined") board = MP.auth({ key: MP_CONNECT.key, apiUrl: MP_CONNECT.apiUrl }).leaderboard(CONFIG.board);
  const taken = new Set([...Object.entries(S.entities.players || {}).filter(([id]) => id !== net.sessionId).map(([, p]) => p.c), ...botColors()]);
  myColor = COLORS.find((c) => !taken.has(c)) || COLORS[Math.floor(Math.random() * COLORS.length)];
  net.me.set({ n: myName, c: myColor, hb: Date.now() });
  if (ATTRACT) { Object.assign(CONFIG, { countdown: 600, resultsMs: 1500, voteMs: 3000, botSkill: [0.85, 0.97] }); $("info").hidden = true; }
  if (new URLSearchParams(location.search).has("test")) window.__test = { round, dancers, me, press, isHost, net: () => net, views, songOf, castVote, writeRound, botList, camera };

})();
